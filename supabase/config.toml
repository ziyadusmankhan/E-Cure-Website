# Local Supabase project; managed deployments get a separate project per client.
# Drizzle owns migrations. Never add healthcare to exposed API schemas.
project_id = "home-health-services"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 54322
shadow_port = 54320
major_version = 17
health_timeout = "2m"

[db.migrations]
enabled = false
schema_paths = []

[db.seed]
enabled = false
sql_paths = []

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = false
jwt_expiry = 900
minimum_password_length = 12

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = false

[realtime]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false

[edge_runtime]
enabled = false
