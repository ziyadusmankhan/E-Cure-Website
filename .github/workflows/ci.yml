name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run db:check-migrations
      - run: npm run test:db
        env:
          TEST_DATABASE_SERVER_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:boundaries
      - run: npm run test:e2e
      - run: npm run test:submissions
        env:
          TEST_DATABASE_SERVER_URL: postgresql://postgres:ci-only-password@127.0.0.1:5432/postgres
      - run: npm run test:profiles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-test-report
          path: |
            playwright-report/
            .profile-results/
            .db-results/
          retention-days: 7
